[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awq"
version = "0.1.0"
description = "AWQ (W4, group-wise) baseline used for the HBQ paper comparisons."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch==2.3.0",
    "transformers==4.46.0",
    "accelerate==0.34.2",
    "tokenizers>=0.12.1",
    "sentencepiece",
    "protobuf",
    "datasets",
    "lm_eval==0.4.11",
]

[tool.setuptools.packages.find]
include = ["awq*"]
exclude = ["results*", "scripts*"]
